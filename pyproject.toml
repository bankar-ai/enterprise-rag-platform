[project]
name = "enterprise-rag-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.0",
    "docling>=2.117.0",
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "flashrank>=0.2.10",
    "langchain-text-splitters>=1.1.2",
    "ollama>=0.6.2",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pymupdf4llm>=1.28.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pymupdf>=1.28.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "D", "BLE", "PGH"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D103", "D104"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "pymupdf4llm"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "faiss"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ollama"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "flashrank"
ignore_missing_imports = true
